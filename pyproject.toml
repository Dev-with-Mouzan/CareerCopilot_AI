[project]
name = "career_copilot_ai"
version = "0.2.0"
description = "CareerCopilot AI — LangGraph-powered career assistant"
authors = [{ name = "Mouzan Raza", email = "mouzan.ai.dev@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = []   # All dependencies are managed in requirements.txt

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]

[project.scripts]
career_copilot_ai = "career_copilot_ai.main:run"
serve = "backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
